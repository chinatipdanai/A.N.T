:root[data-theme=&quot;light&quot;] {

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

    --border,

  background: transparent !important;

  text-decoration: none;
  text-underline-offset: 2px;

a:is(:hover, :focus-visible) {

  text-decoration-style: dashed;

h2,
h3,
h4,
h5,
h6,

}

b,

.table-responsive {

  overflow-x: auto;

  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {

  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);

  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {

}

.table :is(caption, thead th) {

}

.table thead th {

}

}

}

#widget {

  flex-direction: column;

  width: 100%;
  padding: 0;

.card {

  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),

  background: var(--popover);

.viz-grid {

  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));

}

  gap: 2px;

.viz-stat-value {

}

  display: flex;

  align-items: center;
  gap: 10px;
}

.progress {

  border: 0;

.text-muted {

}

.tabular-nums {

.sr-only {

  clip: rect(0, 0, 0, 0);

.viz-controls {

  flex-wrap: wrap;
  align-items: center;

  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;

.btn,
.form-check-input,
.form-control,
.form-range,

}

.btn {

  min-height: 28px;
  align-items: center;

.btn:not(:disabled):hover {

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;

  opacity: 0.4;

  border: 1px solid var(--input);

.form-select:focus-visible {

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {

  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {

  pointer-events: none;
}

  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,

  padding: 0;

  width: 20px;
  height: 20px;
  margin-top: 4px;

}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

    height: 44px;
  }

  function applyGraphTransform() {
    graphWorld.style.transform = `translate(${graphOffsetX}px, ${graphOffsetY}px) scale(${graphScale})`;
    zoomLevel.textContent = `${Math.round(graphScale * 100)}%`;
  }

  function zoomGraph(nextScale, centerX, centerY) {
    const clampedScale = Math.min(2.5, Math.max(0.3, nextScale));
    const worldX = (centerX - graphOffsetX) / graphScale;
    const worldY = (centerY - graphOffsetY) / graphScale;
    graphOffsetX = centerX - worldX * clampedScale;
    graphOffsetY = centerY - worldY * clampedScale;
    graphScale = clampedScale;
    applyGraphTransform();
  }

  function zoomFromCenter(multiplier) {
    zoomGraph(
      graphScale * multiplier,
      graphStage.clientWidth / 2,
      graphStage.clientHeight / 2
    );
  }

  function fitGraph() {
    const padding = 24;
    const availableWidth = Math.max(graphStage.clientWidth - padding * 2, 1);
    const availableHeight = Math.max(graphStage.clientHeight - padding * 2, 1);
    graphScale = Math.min(
      1,
      availableWidth / Math.max(graphWorld.clientWidth, 1),
      availableHeight / Math.max(graphWorld.clientHeight, 1)
    );
    graphOffsetX = (graphStage.clientWidth - graphWorld.clientWidth * graphScale) / 2;
    graphOffsetY = (graphStage.clientHeight - graphWorld.clientHeight * graphScale) / 2;
    applyGraphTransform();
  }

  function centerNode(id, scale = 1) {
    const node = nodeById.get(id);
    if (!node) return;
    graphScale = Math.min(2.5, Math.max(0.65, scale));
    graphOffsetX = graphStage.clientWidth / 2 - graphWorld.clientWidth * node.x / 100 * graphScale;
    graphOffsetY = graphStage.clientHeight / 2 - graphWorld.clientHeight * node.y / 100 * graphScale;
    applyGraphTransform();
  }

  function centerDomain(domain) {
    const members = nodeData.filter(node =&gt; node.domains.includes(domain));
    if (!members.length) return;
    const centerX = members.reduce((sum, node) =&gt; sum + node.x, 0) / members.length;
    const centerY = members.reduce((sum, node) =&gt; sum + node.y, 0) / members.length;
    graphScale = 1;
    graphOffsetX = graphStage.clientWidth / 2 - graphWorld.clientWidth * centerX / 100;
    graphOffsetY = graphStage.clientHeight / 2 - graphWorld.clientHeight * centerY / 100;
    applyGraphTransform();
  }

  function refreshEdgePositions() {
    const lines = root.querySelectorAll(&#x27;.ant-app-edge&#x27;);
    const labels = root.querySelectorAll(&#x27;.ant-app-edge-label&#x27;);
    edgeData.forEach((edge, index) =&gt; {
      const a = nodeById.get(edge.a);
      const b = nodeById.get(edge.b);
      const line = lines[index];
      const label = labels[index];
      line.setAttribute(&#x27;x1&#x27;, `${a.x}%`);
      line.setAttribute(&#x27;y1&#x27;, `${a.y}%`);
      line.setAttribute(&#x27;x2&#x27;, `${b.x}%`);
      line.setAttribute(&#x27;y2&#x27;, `${b.y}%`);
      label.setAttribute(&#x27;x&#x27;, `${(a.x + b.x) / 2}%`);
      label.setAttribute(&#x27;y&#x27;, `${(a.y + b.y) / 2 - 1}%`);
    });
  }

  function buildGraph() {
    const lineMarkup = edgeData.map((edge, index) =&gt; {
      const a = nodeById.get(edge.a);
      const b = nodeById.get(edge.b);
      return `&lt;line class=&quot;ant-app-edge&quot; data-edge-index=&quot;${index}&quot; x1=&quot;${a.x}%&quot; y1=&quot;${a.y}%&quot; x2=&quot;${b.x}%&quot; y2=&quot;${b.y}%&quot;&gt;&lt;/line&gt;`;
    }).join(&#x27;&#x27;);

    const labelMarkup = edgeData.map((edge, index) =&gt; {
      const a = nodeById.get(edge.a);
      const b = nodeById.get(edge.b);
      const x = (a.x + b.x) / 2;
      const y = (a.y + b.y) / 2 - 1;
      return `&lt;text class=&quot;ant-app-edge-label&quot; data-label-index=&quot;${index}&quot; x=&quot;${x}%&quot; y=&quot;${y}%&quot;&gt;${edge.r}&lt;/text&gt;`;
    }).join(&#x27;&#x27;);

    linesLayer.innerHTML = `&lt;g&gt;${lineMarkup}&lt;/g&gt;&lt;g&gt;${labelMarkup}&lt;/g&gt;`;

    nodesLayer.innerHTML = nodeData.map(node =&gt; `
      &lt;button class=&quot;ant-app-node&quot; type=&quot;button&quot; data-id=&quot;${node.id}&quot; data-type=&quot;${node.type}&quot; style=&quot;left:${node.x}%;top:${node.y}%&quot; aria-label=&quot;${typeNames[node.type]}: ${node.label}&quot;&gt;
        &lt;span class=&quot;ant-app-node-mark&quot; aria-hidden=&quot;true&quot;&gt;${typeMarks[node.type]}&lt;/span&gt;
        &lt;span class=&quot;ant-app-node-name&quot;&gt;${node.label}&lt;/span&gt;
        &lt;span class=&quot;ant-app-node-type&quot;&gt;${typeNames[node.type]}&lt;/span&gt;
      &lt;/button&gt;`).join(&#x27;&#x27;);

    root.querySelectorAll(&#x27;.ant-app-node&#x27;).forEach(button =&gt; {
      let dragPointerId = null;
      let dragStartX = 0;
      let dragStartY = 0;
      let nodeStartX = 0;
      let nodeStartY = 0;
      let moved = false;

      button.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (button.dataset.wasDragged === &#x27;true&#x27;) return;
        selectNode(button.dataset.id);
      });

      button.addEventListener(&#x27;pointerdown&#x27;, event =&gt; {
        event.stopPropagation();
        const node = nodeById.get(button.dataset.id);
        dragPointerId = event.pointerId;
        dragStartX = event.clientX;
        dragStartY = event.clientY;
        nodeStartX = node.x;
        nodeStartY = node.y;
        moved = false;
        button.classList.add(&#x27;is-dragging&#x27;);
        button.setPointerCapture(event.pointerId);
        selectNode(node.id);
      });

      button.addEventListener(&#x27;pointermove&#x27;, event =&gt; {
        if (event.pointerId !== dragPointerId) return;
        const deltaX = (event.clientX - dragStartX) / graphScale;
        const deltaY = (event.clientY - dragStartY) / graphScale;
        if (Math.abs(deltaX) + Math.abs(deltaY) &gt; 3) moved = true;
        const node = nodeById.get(button.dataset.id);
        node.x = Math.min(97, Math.max(3, nodeStartX + deltaX / graphWorld.clientWidth * 100));
        node.y = Math.min(96, Math.max(4, nodeStartY + deltaY / graphWorld.clientHeight * 100));
        button.style.left = `${node.x}%`;
        button.style.top = `${node.y}%`;
        refreshEdgePositions();
      });

      function stopNodeDrag(event) {
        if (event.pointerId !== dragPointerId) return;
        dragPointerId = null;
        button.classList.remove(&#x27;is-dragging&#x27;);
        if (moved) {
          button.dataset.wasDragged = &#x27;true&#x27;;
          window.setTimeout(() =&gt; delete button.dataset.wasDragged, 0);
        }
      }

      button.addEventListener(&#x27;pointerup&#x27;, stopNodeDrag);
      button.addEventListener(&#x27;pointercancel&#x27;, stopNodeDrag);
    });
  }

  function directConnections(id) {
    return edgeData.filter(edge =&gt; edge.a === id || edge.b === id).map(edge =&gt; {
      const otherId = edge.a === id ? edge.b : edge.a;
      return { node: nodeById.get(otherId), relation: edge.r };
    });
  }

  function selectNode(id) {
    selectedId = id;
    focused = false;
    const node = nodeById.get(id);
    detailType.textContent = typeNames[node.type];
    detailTitle.textContent = node.label;
    detailSummary.textContent = node.summary;
    const linked = directConnections(id);
    connections.innerHTML = linked.slice(0, 5).map(item =&gt; `
      &lt;div class=&quot;ant-app-connection&quot;&gt;
        &lt;div class=&quot;ant-app-connection-name&quot;&gt;${item.node.label}&lt;/div&gt;
        &lt;div class=&quot;ant-app-connection-relation&quot;&gt;${item.relation} · ${typeNames[item.node.type]}&lt;/div&gt;
      &lt;/div&gt;`).join(&#x27;&#x27;);
    detailDomains.innerHTML = node.domains.map(domain =&gt; `&lt;span class=&quot;ant-app-domain-tag&quot;&gt;${domainNames[domain]}&lt;/span&gt;`).join(&#x27;&#x27;);
    focusButton.textContent = &#x27;Focus on this node&#x27;;
    updateGraph();
  }

  function updateGraph() {
    const activeTypes = new Set([...root.querySelectorAll(&#x27;[data-entity-filter]:checked&#x27;)].map(input =&gt; input.dataset.entityFilter));
    const query = search.value.trim().toLowerCase();
    const matching = new Set(nodeData.filter(node =&gt; !query || node.label.toLowerCase().includes(query)).map(node =&gt; node.id));
    const querySet = new Set(matching);

    if (query) {
      edgeData.forEach(edge =&gt; {
        if (matching.has(edge.a)) querySet.add(edge.b);
        if (matching.has(edge.b)) querySet.add(edge.a);
      });
    }

    const focusSet = new Set([selectedId]);
    if (focused) {
      edgeData.forEach(edge =&gt; {
        if (edge.a === selectedId) focusSet.add(edge.b);
        if (edge.b === selectedId) focusSet.add(edge.a);
      });
    }

    const visible = new Set();
    root.querySelectorAll(&#x27;.ant-app-node&#x27;).forEach(button =&gt; {
      const node = nodeById.get(button.dataset.id);
      const typeMatch = activeTypes.has(node.type);
      const domainMatch = selectedDomain === &#x27;all&#x27; || node.domains.includes(selectedDomain);
      const queryMatch = !query || querySet.has(node.id);
      const focusMatch = !focused || focusSet.has(node.id);
      const show = typeMatch &amp;&amp; domainMatch &amp;&amp; queryMatch;
      button.classList.toggle(&#x27;is-hidden&#x27;, !show);
      button.classList.toggle(&#x27;is-selected&#x27;, node.id === selectedId);
      button.classList.toggle(&#x27;is-dimmed&#x27;, show &amp;&amp; !focusMatch);
      if (show) visible.add(node.id);
    });

    let visibleEdges = 0;
    root.querySelectorAll(&#x27;.ant-app-edge&#x27;).forEach((line, index) =&gt; {
      const edge = edgeData[index];
      const show = visible.has(edge.a) &amp;&amp; visible.has(edge.b);
      const related = edge.a === selectedId || edge.b === selectedId;
      line.classList.toggle(&#x27;is-hidden&#x27;, !show);
      line.classList.toggle(&#x27;is-related&#x27;, related);
      line.classList.toggle(&#x27;is-dimmed&#x27;, show &amp;&amp; focused &amp;&amp; !related);
      if (show) visibleEdges += 1;
    });

    root.querySelectorAll(&#x27;.ant-app-edge-label&#x27;).forEach((label, index) =&gt; {
      const edge = edgeData[index];
      const show = visible.has(edge.a) &amp;&amp; visible.has(edge.b);
      const related = edge.a === selectedId || edge.b === selectedId;
      label.classList.toggle(&#x27;is-hidden&#x27;, !show || !related || !showRelationshipNames.checked);
    });

    empty.style.display = visible.size ? &#x27;none&#x27; : &#x27;grid&#x27;;
    workMeta.textContent = `${visible.size} nodes · ${visibleEdges} relationships`;
  }

  function setView(viewName) {
    const config = viewConfigs[viewName];
    if (!config) return;

    navButtons.forEach(button =&gt; {
      if (button.dataset.view === viewName) button.setAttribute(&#x27;aria-current&#x27;, &#x27;page&#x27;);
      else button.removeAttribute(&#x27;aria-current&#x27;);
    });

    root.querySelectorAll(&#x27;[data-entity-filter]&#x27;).forEach(input =&gt; {
      input.checked = config.types.includes(input.dataset.entityFilter);
    });

    selectedDomain = &#x27;all&#x27;;
    domainSelect.value = &#x27;all&#x27;;
    search.value = &#x27;&#x27;;
    focused = false;
    workTitle.textContent = config.title;
    selectNode(config.selected);
    fitGraph();
  }

  root.querySelectorAll(&#x27;[data-entity-filter]&#x27;).forEach(input =&gt; input.addEventListener(&#x27;change&#x27;, updateGraph));
  navButtons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; setView(button.dataset.view)));
  showRelationshipNames.addEventListener(&#x27;change&#x27;, updateGraph);
  domainSelect.addEventListener(&#x27;change&#x27;, () =&gt; {
    selectedDomain = domainSelect.value;
    focused = false;
    workTitle.textContent = selectedDomain === &#x27;all&#x27; ? &#x27;University talent network&#x27; : `${domainNames[selectedDomain]} network`;
    updateGraph();
    if (selectedDomain === &#x27;all&#x27;) fitGraph();
    else centerDomain(selectedDomain);
  });

  search.addEventListener(&#x27;input&#x27;, () =&gt; { focused = false; updateGraph(); });

  zoomOutButton.addEventListener(&#x27;click&#x27;, () =&gt; zoomFromCenter(0.92));
  zoomInButton.addEventListener(&#x27;click&#x27;, () =&gt; zoomFromCenter(1.08));
  zoomFitButton.addEventListener(&#x27;click&#x27;, fitGraph);

  graphStage.addEventListener(&#x27;wheel&#x27;, event =&gt; {
    event.preventDefault();
    const bounds = graphStage.getBoundingClientRect();
    const centerX = event.clientX - bounds.left;
    const centerY = event.clientY - bounds.top;
    zoomGraph(graphScale * (event.deltaY &lt; 0 ? 1.04 : 0.96), centerX, centerY);
  }, { passive: false });

  graphStage.addEventListener(&#x27;pointerdown&#x27;, event =&gt; {
    if (event.target.closest(&#x27;.ant-app-node, .ant-app-zoom-controls&#x27;)) return;
    panPointerId = event.pointerId;
    panStartX = event.clientX;
    panStartY = event.clientY;
    panOriginX = graphOffsetX;
    panOriginY = graphOffsetY;
    graphStage.classList.add(&#x27;is-panning&#x27;);
    graphStage.setPointerCapture(event.pointerId);

  graphStage.addEventListener(&#x27;pointermove&#x27;, event =&gt; {
    if (event.pointerId !== panPointerId) return;

    graphOffsetY = panOriginY + event.clientY - panStartY;
    applyGraphTransform();
  });

  function stopPanning(event) {
    if (event.pointerId !== panPointerId) return;
    panPointerId = null;
    graphStage.classList.remove(&#x27;is-panning&#x27;);
  }

  graphStage.addEventListener(&#x27;pointerup&#x27;, stopPanning);
  graphStage.addEventListener(&#x27;pointercancel&#x27;, stopPanning);

  focusButton.addEventListener(&#x27;click&#x27;, () =&gt; {
    focused = !focused;
    focusButton.textContent = focused ? &#x27;Show surrounding network&#x27; : &#x27;Focus on this node&#x27;;
    updateGraph();
  });

  buildGraph();
  selectNode(&#x27;narin&#x27;);
  centerNode(&#x27;narin&#x27;);

  const graphResizeObserver = new ResizeObserver(() =&gt; {
    linesLayer.setAttribute(&#x27;viewBox&#x27;, `0 0 ${Math.max(graphWorld.clientWidth, 1)} ${Math.max(graphWorld.clientHeight, 1)}`);
    linesLayer.setAttribute(&#x27;preserveAspectRatio&#x27;, &#x27;none&#x27;);
  });
  graphResizeObserver.observe(graphStage);
  graphResizeObserver.observe(graphWorld);
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
